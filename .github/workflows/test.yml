name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: boron_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/boron_test
      AUTH_SECRET: ${{ secrets.AUTH_SECRET_CI || 'ci-dummy-secret-not-for-real-use-only-for-tests' }}
      # Fixed canonical URL so Auth.js doesn't need to trust the request's
      # Host header at all (safer than AUTH_TRUST_HOST for a known-fixed URL).
      AUTH_URL: http://localhost:3000
      USER_PASSWORD_USER: ${{ secrets.CI_USER_PASSWORD || 'TestPassword123!' }}
      USER_PASSWORD_ADMIN: ${{ secrets.CI_ADMIN_PASSWORD || 'TestPassword123!' }}
      # GOOGLE_*/GITHUB_*/OPENAI_API_KEY intentionally omitted — the app must
      # function without them (see README).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx prisma migrate deploy

      - run: npm run test:unit:coverage

      - run: npm run seed

      - name: Build (with browser sourcemaps for e2e coverage)
        run: npm run build
        env:
          COVERAGE: "true"

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          COVERAGE: "true"

      - name: Merge coverage reports
        if: always()
        run: npx tsx scripts/merge-coverage.ts

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/merged
          retention-days: 14

      - name: Zip coverage report
        if: always()
        run: cd coverage/merged && zip -r ../../coverage-report.zip .

      - name: Upload coverage report to Atlas
        if: always()
        run: |
          curl -sf -X POST http://atlas.civrays.com/api/coverage-reports/upload \
            -H "Authorization: Bearer ${{ secrets.ATLAS_UPLOAD_TOKEN }}" \
            -F "file=@coverage-report.zip"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
